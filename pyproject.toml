[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnalang"
version = "0.1.0"
description = "A small language for quantum circuit families, with evolutionary search, hardware-in-the-loop fitness, and a tamper-evident run ledger."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Devin Phillip Davis", email = "osiris.dnalang@gmail.com"}]
dependencies = ["numpy>=1.24", "qiskit>=1.3"]

[project.optional-dependencies]
sim = ["qiskit-aer>=0.15"]
ibm = ["qiskit-ibm-runtime>=0.35", "networkx>=3"]
dev = ["pytest>=8", "ruff>=0.5", "qiskit-aer>=0.15"]

[project.scripts]
dnalang = "dnalang.cli:main"

[tool.setuptools.packages.find]
include = ["dnalang*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702"]
